[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "runmapper-engine"
version = "0.1.0"
description = "Turn a phrase or a picture into a running route whose GPS trace draws it."
requires-python = ">=3.11"
# Kept lean on purpose: the same package is bundled into a Vercel function
# (see web/scripts/vercel-install.sh), which has a hard size limit.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pillow>=10",
    "svgpathtools>=1.6",
    "fastapi>=0.110",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
serve = ["uvicorn[standard]>=0.29"]
# On Vercel, the record of a search is shared between workers through the Runtime Cache.
vercel = ["vercel-cache>=0.7.2"]
preview = ["matplotlib>=3.8"]
dev = ["pytest>=8", "matplotlib>=3.8", "uvicorn[standard]>=0.29"]

[project.scripts]
runmapper = "runmapper_engine.cli:main"

[tool.setuptools.packages.find]
include = ["runmapper_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
