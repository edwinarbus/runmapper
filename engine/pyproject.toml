[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "runmapper-engine"
version = "0.1.0"
description = "Turn a phrase or a picture into a running route whose GPS trace draws it."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-image>=0.22",
    "pillow>=10",
    "svgpathtools>=1.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
preview = ["matplotlib>=3.8"]
dev = ["pytest>=8", "matplotlib>=3.8"]

[project.scripts]
runmapper = "runmapper_engine.cli:main"

[tool.setuptools.packages.find]
include = ["runmapper_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
