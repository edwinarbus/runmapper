<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

// A panel toggle switch, the metal kind, on a console seen from the front and above:
// a lock washer and a hex nut on a threaded bushing, a collar, and a chrome bat lever on
// a ball, leaning left or right. Rendered with a studio environment for the reflections
// and one key light for the shadow it throws on the deck.
const SIZE = parseInt(new URLSearchParams(location.search).get("size") || "264");
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setSize(SIZE, SIZE);
renderer.setPixelRatio(1);
renderer.setClearColor(0x000000, 0);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
function studio() {
  const s = new THREE.Scene();
  const room = new THREE.Mesh(new THREE.BoxGeometry(200, 120, 200), new THREE.MeshBasicMaterial({ color: 0x26262d, side: THREE.BackSide }));
  room.position.y = 50;
  s.add(room);
  const light = (w, h, x, y, z, k, rx = 0, ry = 0, rz = 0) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(0xffffff).multiplyScalar(k), side: THREE.DoubleSide }));
    m.position.set(x, y, z); m.rotation.set(rx, ry, rz); s.add(m);
  };
  light(90, 40, -40, 95, 20, 6, Math.PI / 2 + 0.5);      // the big soft box above, to the left and in front
  light(40, 90, 80, 40, -20, 2.5, 0, -Math.PI / 2);        // a tall strip on the right, dimmer
  light(120, 30, 0, 30, -95, 1.2);                          // a low glow behind
  light(200, 200, 0, -0.5, 0, 0.25, -Math.PI / 2);          // the deck, dark but not black
  return s;
}
scene.environment = pmrem.fromScene(studio(), 0.02).texture;
scene.environmentIntensity = 1.0;

const camera = new THREE.PerspectiveCamera(26, 1, 1, 400);
camera.position.set(0, 112, 50);
camera.lookAt(0, 9, 0);

// the key light, top left and in front, for the shadow
const key = new THREE.DirectionalLight(0xfff4ea, 2.2);
key.position.set(-34, 80, 30);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -30; key.shadow.camera.right = 30; key.shadow.camera.top = 30; key.shadow.camera.bottom = -30;
key.shadow.camera.near = 10; key.shadow.camera.far = 150;
key.shadow.radius = 7;
key.shadow.bias = -0.0004;
scene.add(key);
scene.add(new THREE.AmbientLight(0xffffff, 0.15));

// the deck: only the shadows it catches are drawn (the page shows the real deck behind)
const catcher = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.ShadowMaterial({ opacity: 0.5 }));
catcher.rotation.x = -Math.PI / 2;
catcher.receiveShadow = true;
scene.add(catcher);
// the dark seat under the nut, where the deck is in the nut's own shade
{
  const c = document.createElement("canvas"); c.width = c.height = 256;
  const g = c.getContext("2d"); const r = g.createRadialGradient(128, 128, 60, 128, 128, 128);
  r.addColorStop(0, "rgba(0,0,0,0.75)"); r.addColorStop(0.55, "rgba(0,0,0,0.35)"); r.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = r; g.fillRect(0, 0, 256, 256);
  const tex = new THREE.CanvasTexture(c);
  const seat = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false }));
  seat.rotation.x = -Math.PI / 2; seat.position.y = 0.02;
  scene.add(seat);
}

const steel = new THREE.MeshStandardMaterial({ color: 0xe4e4e8, metalness: 1.0, roughness: 0.28 });
const steelDull = new THREE.MeshStandardMaterial({ color: 0xc9c9ce, metalness: 1.0, roughness: 0.42 });
const chrome = new THREE.MeshStandardMaterial({ color: 0xf4f4f6, metalness: 1.0, roughness: 0.1 });

// threads: a normal map of fine ridges round the bushing
function threadNormal() {
  const c = document.createElement("canvas"); c.width = 64; c.height = 256;
  const g = c.getContext("2d");
  for (let y = 0; y < 256; y++) {
    const t = ((y % 16) / 16) * Math.PI * 2;
    const ny = Math.sin(t) * 0.95;               // the ridge's slope, up and down
    const r = 128, gg = Math.round(128 + ny * 110), b = 255;
    g.fillStyle = `rgb(${r},${gg},${b})`; g.fillRect(0, y, 64, 1);
  }
  const tex = new THREE.CanvasTexture(c); tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(3, 1.6);
  return tex;
}
const threaded = new THREE.MeshStandardMaterial({ color: 0xe6e6ea, metalness: 1.0, roughness: 0.4, normalMap: threadNormal(), normalScale: new THREE.Vector2(1.2, 1.2) });

const parts = new THREE.Group();
scene.add(parts);
function add(mesh) { mesh.castShadow = true; mesh.receiveShadow = true; parts.add(mesh); return mesh; }
// the lock washer, the hex nut, the threaded bushing, the collar
add(new THREE.Mesh(new THREE.CylinderGeometry(9.2, 9.2, 0.9, 64), steelDull)).position.y = 0.45;
const nut = add(new THREE.Mesh(new THREE.CylinderGeometry(8.6, 8.6, 3.6, 6), steel)); nut.position.y = 0.9 + 1.8; nut.rotation.y = Math.PI / 6;
// the nut's chamfered top: a slightly smaller hex ring on top
add(new THREE.Mesh(new THREE.CylinderGeometry(7.9, 8.6, 0.7, 6), steel)).position.y = 0.9 + 3.6 + 0.35;
add(new THREE.Mesh(new THREE.CylinderGeometry(5.3, 5.3, 9.6, 64), threaded)).position.y = 0.9 + 4.8;
add(new THREE.Mesh(new THREE.CylinderGeometry(5.9, 5.9, 1.4, 64), steel)).position.y = 0.9 + 9.6 + 0.7;
add(new THREE.Mesh(new THREE.CylinderGeometry(4.2, 4.2, 0.9, 64), new THREE.MeshStandardMaterial({ color: 0x111114, metalness: 0.6, roughness: 0.6 }))).position.y = 0.9 + 11 + 0.4;

// the lever: a ball at the pivot and a bat handle, narrow at the ball, full near the tip, rounded off
const pivotY = 0.9 + 11.8;
const lever = new THREE.Group();
lever.position.y = pivotY;
parts.add(lever);
const ball = new THREE.Mesh(new THREE.SphereGeometry(3.0, 48, 32), chrome); ball.castShadow = true; lever.add(ball);
const profile = [];
const L = 23;
for (let i = 0; i <= 60; i++) {
  const u = i / 60;                          // along the handle
  const y = 2.0 + u * L;
  // a shaft of 1.4 that swells into a bulb of 4.3 centred at 77% of the way up, rounded off at the top
  const bulb = 4.3 * Math.sqrt(Math.max(0, 1 - Math.pow((u - 0.77) / 0.25, 2)));
  const shaft = 1.4 + 0.9 * Math.pow(u, 2);
  const r = Math.max(shaft * (u < 0.98 ? 1 : 0), bulb);
  profile.push(new THREE.Vector2(Math.max(0.001, r), y));
}
profile.push(new THREE.Vector2(0.001, 2.0 + L + 0.01));
const bat = new THREE.Mesh(new THREE.LatheGeometry(profile, 72), chrome); bat.castShadow = true; lever.add(bat);

window.setAngle = (deg) => { lever.rotation.z = -THREE.MathUtils.degToRad(deg); renderer.render(scene, camera); };
window.setAngle(-30);
window.__ready = true;
</script>
</body></html>
